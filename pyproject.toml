[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omicsdash"
version = "0.1.0"
description = "Analyses seeded synthetic metabolomics data and renders the results as one offline HTML dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Wen Rui Tan" }]
keywords = ["metabolomics", "dashboard", "reproducible-research", "reporting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
omicsdash = "omicsdash.cli:main"

[project.urls]
Homepage = "https://github.com/Wrlog/metabolomics-dashboard-demo"

[tool.hatch.build.targets.wheel]
packages = ["src/omicsdash"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
